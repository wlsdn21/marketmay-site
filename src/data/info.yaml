name: market may
tagline: |-
  직접 볶아 더 신선한 커피
  매일 마셔도 부담 없는 마켓메이의 로스팅
address: 경상북도 구미시 남통동 공원로 22
phone: 054-457-5020
hours:
  weekday: "10:00 - 22:00"
  closed: "매주 월요일 휴무 / 매월 마지막주 월·화 휴무"
instagram: https://www.instagram.com/market.may_/

# 매장 편의시설 (소개·FAQ·검색 스키마에 사용)
amenities:
  parking: true   # 주차 가능
  wifi: true      # 와이파이 있음
  pets: true      # 반려동물: 외부 좌석 한정 동반 가능 (실내 출입 X)

# 시즌 메뉴
seasonal:
  - 자두주스
  - 백향과주스
  - 딸기요요

# 자주 묻는 질문 (홈 하단 FAQ + FAQ 구조화데이터). q=질문, a=답변
faq:
  - q: 주차 되나요?
    a: 네, 주차 가능합니다.
  - q: 와이파이 있나요?
    a: 네, 매장 와이파이를 이용하실 수 있어요.
  - q: 반려동물 동반 가능한가요?
    a: 실내 출입은 어렵지만, 외부 좌석은 반려동물과 함께 이용하실 수 있어요.
  - q: 영업시간이 어떻게 되나요?
    a: 매일 10:00–22:00 영업합니다. (매주 월요일 휴무, 매월 마지막 주 월·화 휴무)
  - q: 브런치는 몇 시까지 주문되나요?
    a: 브런치는 오후 3시(15:00)까지 주문 가능합니다.
  - q: 예약할 수 있나요?
    a: 예약 문의는 전화(054-457-5020)로 연락해 주세요.
  - q: 시즌 메뉴가 있나요?
    a: 네, 자두주스 · 백향과주스 · 딸기요요를 시즌 메뉴로 즐기실 수 있어요.

# 홈 "메뉴 바로가기" 카드 — 누르면 메뉴 페이지의 해당 카테고리로 이동
