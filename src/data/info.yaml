# 매장 편의시설 (소개·FAQ·검색 스키마에 사용)
amenities:
  parking: true   # 주차 가능
  wifi: true      # 와이파이 있음
  pets: true      # 반려동물: 외부 좌석 한정 동반 가능 (실내 출입 X)

# 시즌 메뉴
seasonal:
  - 자두주스
  - 백향과주스
  - 딸기요요

# 자주 묻는 질문 (홈 하단 FAQ + FAQ 구조화데이터). q=질문, a=답변
faq:
  - q: 주차 되나요?
    a: 매장 앞에 6대의 무료 주차 공간이 있습니다. 만차일 때는 금오산 제2·제3주차장을 이용하실 수 있으며, 공영주차장 요금은 현장 안내를 확인해 주세요.
  - q: 와이파이 있나요?
    a: 네, 매장 와이파이를 이용하실 수 있어요.
  - q: 반려동물 동반 가능한가요?
    a: 실내 출입은 어렵지만, 외부 좌석은 반려동물과 함께 이용하실 수 있어요.
  - q: 영업시간이 어떻게 되나요?
    a: 영업일에는 10:00–22:00 운영합니다. 매주 월요일과 매월 마지막 주 화요일은 쉽니다.
  - q: 브런치는 몇 시까지 주문되나요?
    a: 브런치는 오후 3시(15:00)까지 주문 가능합니다.
  - q: 예약할 수 있나요?
    a: 예약 문의는 전화(054-457-5020)로 연락해 주세요.
  - q: 시즌 메뉴가 있나요?
    a: 네, 자두주스 · 백향과주스 · 딸기요요를 시즌 메뉴로 즐기실 수 있어요.

